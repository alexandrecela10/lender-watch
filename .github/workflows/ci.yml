# Runs the repo's own checks on a clean machine: every pull request, every push to main, and nightly.
# No keys are used: the AI judge stays off, so nothing is sent to Anthropic or Langfuse.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync
      - name: Tests
        run: make test
      - name: Style check
        run: make lint
      - name: Evals (offline gate, thresholds in evals/thresholds.yaml)
        run: make evals
      - name: Live judge check freshness (warning only)
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORY: "Live judge check history"
        run: |
          n=$(gh issue list --state all --search "in:title \"$HISTORY\"" --json number,title \
                --jq "[.[] | select(.title == \"$HISTORY\")][0].number // empty")
          if [ -z "$n" ]; then echo "::warning::No live judge check on main yet."; exit 0; fi
          d=$(gh issue view "$n" --json comments \
                --jq '[.comments[] | select(.body | contains("\"status\": \"PASS\"") or contains("\"status\": \"FAIL\""))] | last | .createdAt // empty')
          if [ -z "$d" ]; then echo "::warning::No completed live judge check on main yet."; exit 0; fi
          age=$(( ( $(date +%s) - $(date -d "$d" +%s) ) / 86400 ))
          limit=$(uv run python -c "import yaml; print(yaml.safe_load(open('evals/thresholds.yaml'))['live']['stale_days'])")
          if [ "$age" -gt "$limit" ]; then
            echo "::warning::The last live judge check on main was $age days ago. GitHub may have turned the weekly schedule off."
          else
            echo "Last live judge check on main: $age days ago."
          fi
