[project]
name = "erm"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.3.0",
    "langfuse>=5.1.0",
    "mcp>=2.3.0",
    "model2vec>=0.10.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]  # eval/test_aliases.py is a paid script, not a test
pythonpath = ["."]

[tool.ruff.lint]
# Day-1 baseline (2026-11-07): these rules fail on existing code. Ruff marks every
# fix for them as unsafe, and day 1 changes no behaviour, so they are ignored here.
# Remove one at a time with its own fix and a re-run of the evals.
# B023 in eval/verify_flags.py (loop variable `window` not bound) may be a real bug.
ignore = [
    "B023",    # function uses loop variable
    "C408",    # dict()/list() call instead of literal
    "FLY002",  # static join to f-string
    "FURB167", # regex flag alias
    "I001",    # unsorted imports
    "RUF046",  # int() cast on an int
    "SIM115",  # open() without a context manager
    "SIM905",  # split on a static string
    "UP037",   # quoted annotation
]
