<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lender Watch</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css">
</head>
<body>
  <main>
    <p class="status" id="status">Connecting to the workbook…</p>
    <div class="row" id="signin-row" hidden>
      <button id="signin" class="primary">Sign in</button>
      <p class="note" id="signed-in" hidden></p>
    </div>
    <div class="row">
      <button id="check" class="primary">Check this workbook</button>
    </div>
    <div id="chat" aria-live="polite"></div>
  </main>
  <script src="auth.js"></script>
  <script src="core.js"></script>
  <script src="api.js"></script>
  <script src="functions.js"></script>
  <script src="taskpane.js"></script>
</body>
</html>
